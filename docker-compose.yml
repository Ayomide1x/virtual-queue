services:
  redis:
    image: redis:7-alpine
    # Append-only file + volume: the queue survives restarts of either container.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      HOST: 0.0.0.0
      # Base URL phones use to reach the app (lobby QR codes and share links).
      # ./scripts/up.sh fills this in with your LAN address automatically.
      PUBLIC_URL: ${PUBLIC_URL:-}
      HOST_IP: ${HOST_IP:-}
      PUBLIC_PORT: ${PORT:-3000}
      # Offices and all their data expire after this many days without activity.
      OFFICE_TTL_DAYS: ${OFFICE_TTL_DAYS:-30}
      # Per-IP limits, as requests/seconds.
      RATE_LIMIT_CREATE_OFFICE: ${RATE_LIMIT_CREATE_OFFICE:-10/3600}
      RATE_LIMIT_JOIN: ${RATE_LIMIT_JOIN:-30/60}
      # Set when running behind a reverse proxy so rate limits see real client IPs (e.g. 1).
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Alerts (optional). `npm run setup:alerts` writes VAPID keys to .env, which compose reads.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      # Email fallback via Resend's free tier; without a key, emails are only logged (addresses masked).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Virtual Queue <onboarding@resend.dev>}
      RATE_LIMIT_NOTIFY: ${RATE_LIMIT_NOTIFY:-20/600}
      TZ: ${TZ:-UTC}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
