# A fixed project name keeps this app's containers, network and volume separate
# from any other Compose app on the same machine.
name: virtual-queue

services:
  redis:
    image: redis:7-alpine
    # Append-only file + volume: the queue survives restarts of either container.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No ports: Redis is reachable only by the app, on Compose's private network.

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-}
    ports:
      # LAN demo: all interfaces, so phones on the Wi-Fi can connect.
      # On a server behind a reverse proxy, set BIND_IP=127.0.0.1 (see deploy/README.md).
      - "${BIND_IP:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      HOST: 0.0.0.0
      # Base URL phones use to reach the app (lobby QR codes and share links).
      # ./scripts/up.sh fills this in with your LAN address automatically.
      PUBLIC_URL: ${PUBLIC_URL:-}
      HOST_IP: ${HOST_IP:-}
      PUBLIC_PORT: ${PORT:-3000}
      # Offices and all their data expire after this many days without activity.
      OFFICE_TTL_DAYS: ${OFFICE_TTL_DAYS:-30}
      # Days of ticket history kept for the analytics dashboard.
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-90}
      # Per-IP limits, as requests/seconds.
      RATE_LIMIT_CREATE_OFFICE: ${RATE_LIMIT_CREATE_OFFICE:-10/3600}
      RATE_LIMIT_JOIN: ${RATE_LIMIT_JOIN:-30/60}
      # Set when running behind a reverse proxy so rate limits see real client IPs (e.g. 1).
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Alerts (optional). `npm run setup:alerts` writes VAPID keys to .env, which compose reads.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      # Email fallback via Resend's free tier; without a key, emails are only logged (addresses masked).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Virtual Queue <onboarding@resend.dev>}
      RATE_LIMIT_NOTIFY: ${RATE_LIMIT_NOTIFY:-20/600}
      TZ: ${TZ:-UTC}
      NODE_ENV: ${NODE_ENV:-production}
      # Monitoring: JSON logs by default in production; error tracking only if SENTRY_DSN is set.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_ENV: ${APP_ENV:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Time for a graceful shutdown (in-flight requests, alert sends) on deploys.
    stop_grace_period: 20s
    # Keep container logs from filling the disk.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  redis-data:
